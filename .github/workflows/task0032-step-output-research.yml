name: Task0032-S linked Timer1 research
on:
  pull_request:
    branches: [ai-firmware-review]
    paths:
      - 'research/task0032-step-output/**'
      - '.github/workflows/task0032-step-output-research.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: task0032-step-output-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  linked-timer1:
    if: github.event.pull_request.head.ref == 'research/Task0032-step-output' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: firmware-evidence-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch canonical evidence for this exact test merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/step-output"
          # Do not rebuild or duplicate the canonical pipeline.
          for attempt in $(seq 1 100); do
            id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$EVIDENCE" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty')
            if [[ -n "$id" ]]; then
              echo "Canonical artifact: $id; test merge: $GITHUB_SHA"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/firmware-evidence.zip"
              echo "$id" > "$RUNNER_TEMP/step-output/canonical-artifact-id.txt"
              break
            fi
            sleep 10
          done
          test -s "$RUNNER_TEMP/firmware-evidence.zip"
      - name: Fetch immutable Task0033 handoff
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/task0033/transport-contract-results.json?ref=4cdb22106e66c02f86dffeb3f49a6a15506c2038" --jq .content | base64 -d > "$RUNNER_TEMP/transport.json"
      - name: Trace four linked AVR images
        run: |
          python3 research/task0032-step-output/linked_timer1.py "$RUNNER_TEMP/firmware-evidence.zip" "$RUNNER_TEMP/transport.json" "$RUNNER_TEMP/step-output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task0032-step-output-${{ github.sha }}
          path: ${{ runner.temp }}/step-output
          retention-days: 7
