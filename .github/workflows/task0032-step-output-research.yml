name: Task0032-S linked Timer1 research
on:
  pull_request:
    branches: [ai-firmware-review]
    paths:
      - 'research/task0032-step-output/**'
      - '.github/workflows/task0032-step-output-research.yml'
      - '!research/task0032-step-output/**/*.md'
      - '!research/task0032-step-output/*.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: task0032-step-output-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  linked-timer1:
    if: github.event.pull_request.head.ref == 'research/Task0032-step-output' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: firmware-evidence-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Actual-source ECMP and nonblocking wake lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/step-output"
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -I Repetier research/task0032-step-output/candidate-replay.cpp -o "$RUNNER_TEMP/candidate-replay"
          "$RUNNER_TEMP/candidate-replay" | tee "$RUNNER_TEMP/step-output/candidate-replay.txt"
          git grep -n -E 'extrusionCompensation\.|ExtrusionCompensation::|enable[XYZ]Stepper\(|Extruder::enable\(|enabledStepper\[|stepHomeCheck\(|ScanMove' -- Repetier > "$RUNNER_TEMP/step-output/actual-callers.txt"
      - name: Fetch canonical evidence for this exact test merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/step-output"
          # Do not rebuild or duplicate the canonical pipeline.
          for attempt in $(seq 1 100); do
            id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$EVIDENCE" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty')
            if [[ -n "$id" ]]; then
              echo "Canonical artifact: $id; test merge: $GITHUB_SHA"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/firmware-evidence.zip"
              echo "$id" > "$RUNNER_TEMP/step-output/canonical-artifact-id.txt"
              break
            fi
            sleep 10
          done
          test -s "$RUNNER_TEMP/firmware-evidence.zip"
      - name: Fetch immutable Task0033 handoff
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/task0033/transport-contract-results.json?ref=4cdb22106e66c02f86dffeb3f49a6a15506c2038" --jq .content | base64 -d > "$RUNNER_TEMP/transport.json"
      - name: Trace four linked AVR images
        run: |
          python3 research/task0032-step-output/linked_timer1.py "$RUNNER_TEMP/firmware-evidence.zip" "$RUNNER_TEMP/transport.json" "$RUNNER_TEMP/step-output"
      - name: Reuse exact prior Q23 binaries for comparator-only correction
        id: reuse
        shell: bash
        run: |
          set -euo pipefail
          prior=3520e5c20b83983c4b384f1091815034e0c78826
          reuse=no
          if git fetch --depth=1 origin "$prior" && git diff --quiet "$prior" HEAD -- Repetier tools/avr-motion-diagnostics research/task0032-step-output/ecmp-q23.h research/task0032-step-output/linked_timer1.py; then
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15180560003/zip" > "$RUNNER_TEMP/prior-q23.zip"; then
              echo "458732831c0f67863d53a410fc104f51f78b024c2d2e0513368dbeaed898ba45  $RUNNER_TEMP/prior-q23.zip" | sha256sum -c -
              mkdir -p "$RUNNER_TEMP/prior-q23"
              unzip -q "$RUNNER_TEMP/prior-q23.zip" 'q23/*/candidate.zip' 'q23/*/candidate.diff' -d "$RUNNER_TEMP/prior-q23"
              test -f "$RUNNER_TEMP/prior-q23/q23/raw/candidate.zip"
              test -f "$RUNNER_TEMP/prior-q23/q23/guarded/candidate.zip"
              printf '%s\n' 'prior artifact 15180560003; tested merge d350b449d98b39488d432664aa0a785e378ce908; verified digest; identical production source and candidate header' > "$RUNNER_TEMP/step-output/q23-reuse.txt"
              reuse=yes
            fi
          fi
          echo "available=$reuse" >> "$GITHUB_OUTPUT"
      - uses: arduino/setup-arduino-cli@v2
        if: steps.reuse.outputs.available != 'yes'
        with:
          version: 1.2.2
      - name: Install same pinned AVR core for counterfactual only
        if: steps.reuse.outputs.available != 'yes'
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Compare linked Q23 arithmetic with and without explicit E pulse guards
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.reuse.outputs.available }}" == yes ]]; then
            python3 research/task0032-step-output/q23-linked.py --baseline "$RUNNER_TEMP/step-output" --out "$RUNNER_TEMP/step-output/q23" --reuse "$RUNNER_TEMP/prior-q23/q23"
          else
            python3 research/task0032-step-output/q23-linked.py --baseline "$RUNNER_TEMP/step-output" --out "$RUNNER_TEMP/step-output/q23" --tools "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task0032-step-output-${{ github.sha }}
          path: ${{ runner.temp }}/step-output
          retention-days: 7
