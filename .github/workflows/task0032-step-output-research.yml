name: Task0032-S linked Timer1 research
on:
  pull_request:
    branches: [ai-firmware-review]
    paths:
      - 'research/task0032-step-output/**'
      - '.github/workflows/task0032-step-output-research.yml'
      - '!research/task0032-step-output/**/*.md'
      - '!research/task0032-step-output/*.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: task0032-step-output-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  linked-timer1:
    if: github.event.pull_request.head.ref == 'research/Task0032-step-output' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: firmware-evidence-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Actual-source ECMP and nonblocking wake lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/step-output"
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -I Repetier research/task0032-step-output/candidate-replay.cpp -o "$RUNNER_TEMP/candidate-replay"
          "$RUNNER_TEMP/candidate-replay" | tee "$RUNNER_TEMP/step-output/candidate-replay.txt"
          git grep -n -E 'extrusionCompensation\.|ExtrusionCompensation::|enable[XYZ]Stepper\(|Extruder::enable\(|enabledStepper\[|stepHomeCheck\(|ScanMove' -- Repetier > "$RUNNER_TEMP/step-output/actual-callers.txt"
      - name: Actual-source Z-hop reversibility and logical direction ownership
        run: |
          set -o pipefail
          python3 research/task0032-step-output/z-hop-reversibility.py | tee "$RUNNER_TEMP/step-output/z-hop-reversibility.txt"
      - name: Actual bed geometry fade, wipe and layer tracking replay
        run: |
          set -o pipefail
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -I Repetier research/task0032-step-output/z-geometry-replay.cpp -o "$RUNNER_TEMP/z-geometry-replay"
          "$RUNNER_TEMP/z-geometry-replay" | tee "$RUNNER_TEMP/step-output/z-geometry-replay.txt"
      - name: Region-aware geometric feedforward curvature and reversal model
        run: |
          python3 research/task0032-step-output/z-feedforward.py "$RUNNER_TEMP/step-output/z-feedforward-results.json"
      - name: Active integer feedforward chord and lattice invariants
        run: |
          set -o pipefail
          c++ -std=c++11 -O2 -Wall -Wextra -Werror research/task0032-step-output/z-feedforward-dda-replay.cpp -o "$RUNNER_TEMP/z-dda"
          "$RUNNER_TEMP/z-dda" | tee "$RUNNER_TEMP/step-output/z-dda.txt"
          python3 research/task0032-step-output/z-feedforward-lattice.py "$RUNNER_TEMP/step-output/z-lattice.json"
      - name: Compact physical Z chord and two-slot context publication
        run: |
          set -o pipefail
          c++ -std=c++11 -O2 -Wall -Wextra -Werror research/task0032-step-output/z-chord-handoff-replay.cpp -o "$RUNNER_TEMP/z-handoff"
          "$RUNNER_TEMP/z-handoff" | tee "$RUNNER_TEMP/step-output/z-handoff.txt"
          c++ -std=c++11 -O2 -Wall -Wextra -Werror research/task0032-step-output/z-physical-chord-replay.cpp -o "$RUNNER_TEMP/z-physical"
          "$RUNNER_TEMP/z-physical" | tee "$RUNNER_TEMP/step-output/z-physical.txt"
          python3 research/task0032-step-output/z-physical-path.py "$RUNNER_TEMP/step-output/z-physical-path.json"
      - name: Foreground physical chord preparation and actual bed geometry
        run: |
          set -o pipefail
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -I Repetier research/task0032-step-output/z-chord-preparer-replay.cpp -o "$RUNNER_TEMP/z-preparer"
          "$RUNNER_TEMP/z-preparer" | tee "$RUNNER_TEMP/step-output/z-preparer.txt"
      - name: Signed Z demand and logical retract classification
        run: |
          set -o pipefail
          c++ -std=c++11 -O2 -Wall -Wextra -Werror research/task0032-step-output/z-net-demand-replay.cpp -o "$RUNNER_TEMP/z-net"
          "$RUNNER_TEMP/z-net" | tee "$RUNNER_TEMP/step-output/z-net.txt"
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -I Repetier research/task0032-step-output/layer-retraction-replay.cpp -o "$RUNNER_TEMP/z-layer"
          "$RUNNER_TEMP/z-layer" | tee "$RUNNER_TEMP/step-output/z-layer.txt"
      - name: Combined physical Z geometry velocity and curvature envelope
        run: |
          python3 research/task0032-step-output/z-geometry-budget.py "$RUNNER_TEMP/step-output/z-geometry-budget.json"
      - name: No intermediate settling rate-only continuous XYZ replay
        run: |
          python3 research/task0032-step-output/z-feedforward-stream.py "$RUNNER_TEMP/step-output/z-stream.json"
      - name: Shared Z correction clock characterization
        run: |
          python3 research/task0032-step-output/z-clock-research.py "$RUNNER_TEMP/step-output/z-clock-results.json"
      - name: Integer Z ramp and deadline invariants
        run: |
          c++ -std=c++11 -O2 -Wall -Wextra -Werror research/task0032-step-output/z-correction-clock-replay.cpp -o "$RUNNER_TEMP/z-clock-replay"
          "$RUNNER_TEMP/z-clock-replay" | tee "$RUNNER_TEMP/step-output/z-clock-replay.txt"
      - name: Exhaustive normalized inverse root bounds
        run: |
          python3 research/task0032-step-output/inverse-root-research.py --out "$RUNNER_TEMP/step-output/inverse-root"
      - name: Direct Z ramp and cached plateau invariants
        run: |
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -I "$RUNNER_TEMP/step-output/inverse-root" research/task0032-step-output/direct-z-ramp-replay.cpp -o "$RUNNER_TEMP/direct-z-ramp-replay"
          "$RUNNER_TEMP/direct-z-ramp-replay" | tee "$RUNNER_TEMP/step-output/direct-z-ramp-replay.txt"
      - name: Replay immutable unified candidate early when sources are unchanged
        id: unified_reuse
        shell: bash
        run: |
          set -euo pipefail
          prior=7fd4c07ac63f665f061dc120796270e004e3a8ff
          git fetch --depth=1 origin "$prior"
          if ! git diff --quiet "$prior" HEAD -- Repetier research/task0032-step-output/unified-z-source.py research/task0032-step-output/z-correction-clock.h research/task0032-step-output/q23-linked.py research/task0032-step-output/motor-wake-source.py research/task0032-step-output/motor-wake.h research/task0032-step-output/ecmp-q23.h; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15191429677/zip" > "$RUNNER_TEMP/verified-unified.zip"; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "a60a16b52f7c0faa385c0cb0ebf7c2664bf9e47c3ac5e7ca89f26aabb744ef00  $RUNNER_TEMP/verified-unified.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(root/"verified-unified.zip") as z:
              for variant in ("q23/wake-jog-idle","z-unified/unified-z"):
                  dest=root/"step-output"/variant
                  dest.mkdir(parents=True,exist_ok=True)
                  (dest/"candidate.zip").write_bytes(z.read(variant+"/candidate.zip"))
                  with zipfile.ZipFile(dest/"candidate.zip") as candidate:
                      m=json.loads(candidate.read("summary.json"))
                      for board,digest in m["elf"].items():
                          assert hashlib.sha256(candidate.read(board+"/build/Repetier.ino.elf")).hexdigest()==digest
          (root/"step-output/reused-unified-evidence.txt").write_text("run45987116132 artifact15191429677; source equality and ZIP/ELF hashes verified\n")
          PY
          python3 research/task0032-step-output/unified-z-linked-replay.py "$RUNNER_TEMP/step-output/q23/wake-jog-idle/candidate.zip" "$RUNNER_TEMP/step-output/z-unified/unified-z/candidate.zip" "$RUNNER_TEMP/step-output/z-unified-results.json"
          echo "available=yes" >> "$GITHUB_OUTPUT"
      - name: Fetch canonical evidence for this exact test merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/step-output"
          # Do not rebuild or duplicate the canonical pipeline.
          for attempt in $(seq 1 100); do
            id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$EVIDENCE" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id // empty')
            if [[ -n "$id" ]]; then
              echo "Canonical artifact: $id; test merge: $GITHUB_SHA"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/firmware-evidence.zip"
              echo "$id" > "$RUNNER_TEMP/step-output/canonical-artifact-id.txt"
              break
            fi
            sleep 10
          done
          test -s "$RUNNER_TEMP/firmware-evidence.zip"
      - name: Fetch immutable Task0033 handoff
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/task0033/transport-contract-results.json?ref=4cdb22106e66c02f86dffeb3f49a6a15506c2038" --jq .content | base64 -d > "$RUNNER_TEMP/transport.json"
      - name: Reuse green unchanged independent candidate
        id: reuse
        shell: bash
        run: |
          set -euo pipefail
          prior=19357bfc85ac6ad70f932a22e482abe423fe2819
          git fetch --depth=1 origin "$prior"
          if ! git diff --quiet "$prior" HEAD -- Repetier tools/avr-motion-diagnostics research/task0032-step-output/q23-linked.py research/task0032-step-output/linked_timer1.py research/task0032-step-output/ecmp-q23.h research/task0032-step-output/motor-wake.h research/task0032-step-output/motor-wake-source.py research/task0032-step-output/candidate-replay.cpp research/task0032-step-output/wake-linked-replay.py research/task0032-step-output/jog-stop-interleave.py; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15191456760/zip" > "$RUNNER_TEMP/verified-prior.zip"; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "df47b5a32c8915593e8bddff1bc40b56ead07593a8e626b9f8de27cc21c7c945  $RUNNER_TEMP/verified-prior.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          dest=root/"step-output/q23/wake-jog-idle"
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(root/"verified-prior.zip") as z:
              (dest/"candidate.zip").write_bytes(z.read("q23/wake-jog-idle/candidate.zip"))
          with zipfile.ZipFile(dest/"candidate.zip") as z:
              m=json.loads(z.read("summary.json"))
              assert m["variant"]=="wake-jog-idle"
              for b,digest in m["elf"].items():
                  assert hashlib.sha256(z.read(b+"/build/Repetier.ino.elf")).hexdigest()==digest
          (root/"step-output/reused-independent-evidence.txt").write_text("run45984973835 artifact15191456760; source equality and ZIP/ELF hashes verified\n")
          PY
          echo "available=yes" >> "$GITHUB_OUTPUT"
      - name: Trace four linked AVR images
        if: steps.reuse.outputs.available != 'yes'
        run: |
          python3 research/task0032-step-output/linked_timer1.py "$RUNNER_TEMP/firmware-evidence.zip" "$RUNNER_TEMP/transport.json" "$RUNNER_TEMP/step-output"
      - name: Replay baseline jog stop writer interleavings
        if: steps.reuse.outputs.available != 'yes'
        run: |
          python3 research/task0032-step-output/jog-stop-interleave.py "$RUNNER_TEMP/firmware-evidence.zip" "$RUNNER_TEMP/step-output/jog-baseline.json"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.2.2
      - name: Install same pinned AVR core for counterfactual only
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Isolated Z clock AVR timing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsimavr-dev libelf-dev
          gh api "repos/$GITHUB_REPOSITORY/contents/research/task0032-planner-queue/simavr-trace.c?ref=e1b9763" --jq .content | base64 -d > "$RUNNER_TEMP/simavr-trace.c"
          test "$(git hash-object "$RUNNER_TEMP/simavr-trace.c")" = c0dfeca055159db9b918c6a8420bc2d441bae079
          python3 research/task0032-step-output/z-clock-avr-bench.py --compiler "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin/avr-g++" --runner-source "$RUNNER_TEMP/simavr-trace.c" --out "$RUNNER_TEMP/step-output/z-clock-avr"
      - name: Quake and conservative integer inverse root AVR comparison
        run: |
          python3 research/task0032-step-output/inverse-root-research.py --out "$RUNNER_TEMP/step-output/inverse-root" --compiler "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin/avr-g++" --runner-source "$RUNNER_TEMP/simavr-trace.c"
      - name: Isolated active integer chord AVR timing
        run: |
          python3 research/task0032-step-output/z-feedforward-dda-bench.py --out "$RUNNER_TEMP/step-output/z-dda-avr" --compiler "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin/avr-g++" --runner-source "$RUNNER_TEMP/simavr-trace.c"
      - name: Isolated foreground geometry preparation and service-horizon cost
        run: |
          python3 research/task0032-step-output/z-preparer-avr-bench.py --out "$RUNNER_TEMP/step-output/z-preparer-avr" --compiler "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin/avr-g++" --runner-source "$RUNNER_TEMP/simavr-trace.c"
      - name: Compare measured preparation service horizons and bounded prefill
        run: |
          python3 research/task0032-step-output/z-preparation-horizon.py "$RUNNER_TEMP/step-output/z-preparer-avr/results.json" "$RUNNER_TEMP/step-output/z-preparation-horizon.json"
      - name: Linked motor wake candidate with minimal Q23 and narrow queue masks
        if: steps.reuse.outputs.available != 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 research/task0032-step-output/q23-linked.py --baseline "$RUNNER_TEMP/step-output" --out "$RUNNER_TEMP/step-output/q23" --variant wake-jog-idle --tools "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin"
      - name: Replay actual cold and warm activation across successive Timer1 calls
        if: success() && steps.reuse.outputs.available != 'yes'
        run: |
          python3 research/task0032-step-output/wake-linked-replay.py "$RUNNER_TEMP/step-output/q23/wake-jog-idle/candidate.zip" "$RUNNER_TEMP/step-output/wake-replay.json"
      - name: Require coherent jog stop interleavings in candidate
        if: success() && steps.reuse.outputs.available != 'yes'
        run: |
          python3 research/task0032-step-output/jog-stop-interleave.py "$RUNNER_TEMP/step-output/q23/wake-jog-idle/candidate.zip" "$RUNNER_TEMP/step-output/jog-candidate.json" --require-safe
      - name: Four actual firmware builds with shared nominal and Z deadlines
        if: steps.unified_reuse.outputs.available != 'yes'
        run: |
          python3 research/task0032-step-output/unified-z-source.py --out "$RUNNER_TEMP/step-output/z-unified" --tools "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin"
      - name: Linked unified Z motion and nominal continuity replay
        if: steps.unified_reuse.outputs.available != 'yes'
        run: |
          python3 research/task0032-step-output/unified-z-linked-replay.py "$RUNNER_TEMP/step-output/q23/wake-jog-idle/candidate.zip" "$RUNNER_TEMP/step-output/z-unified/unified-z/candidate.zip" "$RUNNER_TEMP/step-output/z-unified-results.json"
      - name: Reuse direct-period linked images when all generator inputs match
        id: direct_reuse
        shell: bash
        run: |
          set -euo pipefail
          prior=9249b19d2520003a5b5de9c84480ff80cb890da7
          git fetch --depth=1 origin "$prior"
          if ! git diff --quiet "$prior" HEAD -- Repetier research/task0032-step-output/direct-z-source.py research/task0032-step-output/direct-z-ramp.h research/task0032-step-output/inverse-root-research.py research/task0032-step-output/unified-z-source.py research/task0032-step-output/z-correction-clock.h research/task0032-step-output/q23-linked.py research/task0032-step-output/motor-wake-source.py research/task0032-step-output/motor-wake.h research/task0032-step-output/ecmp-q23.h; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15212370331/zip" > "$RUNNER_TEMP/verified-direct.zip"; then
            echo "available=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "7de2a72fd2b74a18b1309940a0e57022af0cf92d8ebe25db79e8de9ae3a54449  $RUNNER_TEMP/verified-direct.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(root/"verified-direct.zip") as z:
              for variant in ("direct-z","direct-z-merge-study"):
                  dest=root/"step-output/z-direct"/variant
                  dest.mkdir(parents=True,exist_ok=True)
                  archive=dest/"candidate.zip"
                  archive.write_bytes(z.read("z-direct/"+variant+"/candidate.zip"))
                  with zipfile.ZipFile(archive) as image:
                      meta=json.loads(image.read("summary.json"))
                      assert meta["variant"]==variant
                      for b,digest in meta["elf"].items():
                          assert hashlib.sha256(image.read(b+"/build/Repetier.ino.elf")).hexdigest()==digest
          (root/"step-output/reused-direct-evidence.txt").write_text("run46022899803 artifact15212370331; source equality and ZIP/ELF hashes verified\n")
          PY
          echo "available=yes" >> "$GITHUB_OUTPUT"
      - name: Four actual firmware builds with direct-period Z ramp
        if: steps.direct_reuse.outputs.available != 'yes'
        run: |
          python3 research/task0032-step-output/direct-z-source.py --out "$RUNNER_TEMP/step-output/z-direct" --tools "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin"
      - name: Linked direct-period nominal and correction replay
        run: |
          python3 research/task0032-step-output/unified-z-linked-replay.py "$RUNNER_TEMP/step-output/q23/wake-jog-idle/candidate.zip" "$RUNNER_TEMP/step-output/z-direct/direct-z/candidate.zip" "$RUNNER_TEMP/step-output/z-direct-results.json"
      - name: Build linked correction gap study (diagnostic input only)
        if: steps.direct_reuse.outputs.available != 'yes'
        run: |
          python3 research/task0032-step-output/direct-z-source.py --merge-study --out "$RUNNER_TEMP/step-output/z-direct" --tools "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin"
      - name: Compare linked correction gap policies on representative boards
        run: |
          python3 research/task0032-step-output/z-merge-gap-replay.py "$RUNNER_TEMP/step-output/z-direct/direct-z-merge-study/candidate.zip" "$RUNNER_TEMP/step-output/z-merge-gap-results.json"
      - name: Four actual firmware builds with explicit Z direction and packed IRQ boundary
        run: |
          python3 research/task0032-step-output/z-explicit-source.py --boundary --out "$RUNNER_TEMP/step-output/z-explicit" --tools "$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin"
      - name: Explicit logical Z direction with physical GPIO and opposing requests
        run: |
          python3 research/task0032-step-output/z-explicit-linked-replay.py "$RUNNER_TEMP/step-output/z-direct/direct-z/candidate.zip" "$RUNNER_TEMP/step-output/z-explicit/explicit-z-boundary/candidate.zip" "$RUNNER_TEMP/step-output/z-explicit-direction.json"
      - name: Verify direct packed Z and XY stop writer interleavings
        run: |
          python3 research/task0032-step-output/z-boundary-stop-replay.py "$RUNNER_TEMP/step-output/z-explicit/explicit-z-boundary/candidate.zip" "$RUNNER_TEMP/step-output/z-boundary-stop.json"
          python3 research/task0032-step-output/jog-stop-interleave.py "$RUNNER_TEMP/step-output/z-explicit/explicit-z-boundary/candidate.zip" "$RUNNER_TEMP/step-output/z-boundary-xy-stop.json" --require-safe
      - name: Linked explicit Z nominal and correction continuity
        run: |
          python3 research/task0032-step-output/unified-z-linked-replay.py "$RUNNER_TEMP/step-output/q23/wake-jog-idle/candidate.zip" "$RUNNER_TEMP/step-output/z-explicit/explicit-z-boundary/candidate.zip" "$RUNNER_TEMP/step-output/z-explicit-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task0032-step-output-${{ github.sha }}
          path: ${{ runner.temp }}/step-output
          retention-days: 7
