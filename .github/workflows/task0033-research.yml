name: Task0033 private research verification
on:
  pull_request:
    branches: [ai-firmware-review]
    paths:
      - 'tools/task0033/**'
      - '.github/workflows/task0033-research.yml'
permissions:
  contents: read
jobs:
  research:
    if: github.event.pull_request.head.ref == 'task/Task0033-uart-robustness' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record revision
        run: git rev-parse HEAD
      - name: Execute deterministic research models
        shell: bash
        run: |
          set -euo pipefail
          for script in uart-model pacing-model priority-model recovery-contract; do
            node "tools/task0033/${script}.js" > "/tmp/${script}-results.json"
            diff -u "tools/task0033/${script}-results.json" "/tmp/${script}-results.json"
          done
      - name: Characterize actual firmware loss behavior
        run: python3 tools/task0033/loss-replay.py
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.2.2
      - name: Install same pinned AVR core as standard CI
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Compare isolated linked AVR ISR candidates
        shell: bash
        run: |
          set -euo pipefail
          compiler="$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin/avr-g++"
          python3 tools/task0033/isr-candidates.py --compiler "$compiler" --out "$RUNNER_TEMP/task0033-isr"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task0033-isr-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/task0033-isr
          retention-days: 7
          if-no-files-found: warn
