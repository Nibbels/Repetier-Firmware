name: Task0032 simulation checks
on:
  pull_request:
    branches: [ai-firmware-review]
    paths:
      - 'tools/task0032/**'
      - '.github/workflows/task0032-simulation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'task/Task0032-quality-packing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Run task-private self-tests and reproduce evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task0032"
          out="$RUNNER_TEMP/task0032"
          git rev-parse HEAD > "$out/checkout-sha.txt"
          node --version > "$out/node-version.txt"
          sha256sum tools/task0032/*.cjs > "$out/source-sha256.txt"
          # Reuse the immutable Task0033 handoff; do not copy/fork its model.
          transport=4cdb22106e66c02f86dffeb3f49a6a15506c2038
          git fetch --no-tags --depth=1 origin "$transport"
          git show "$transport:tools/task0033/transport-contract-results.json" > "$out/transport-contract-input.json"
          node tools/task0032/transport-handoff.cjs "$out/transport-contract-input.json" > "$out/transport-handoff.json"
          node tools/task0032/baud-validation.cjs > "$out/baud-validation.json"
          python3 tools/task0032/parser-wire-replay.py | tee "$out/parser-wire-replay.log"
          grep '^TASK0032_WIRE ' "$out/parser-wire-replay.log" | sed 's/^TASK0032_WIRE //' > "$out/parser-wire-results.jsonl"
          test "$(wc -l < "$out/parser-wire-results.jsonl")" -eq 4
          python3 tools/task0032/parser-wire-replay.py --reject-unsupported | tee "$out/parser-unsupported-candidate.log"
          grep -q '^TASK0032_UNSUPPORTED_REJECT ' "$out/parser-unsupported-candidate.log"
          python3 tools/task0032/fixed-uart-init.py | tee "$out/fixed-uart-init.log"
          python3 tools/task0032/fixed-queue-capacity.py | tee "$out/fixed-queue-capacity.log"
          git show "$transport:tools/task0033/loss-replay.py" > "$out/prior-loss-replay.py"
          python3 tools/task0032/loss-gate-replay.py --prior-replay "$out/prior-loss-replay.py" | tee "$out/loss-gate-replay.log"
          python3 tools/task0032/loss-gate-replay.py --prior-replay "$out/prior-loss-replay.py" --combined | tee "$out/loss-gate-combined-replay.log"
          sha256sum tools/task0032/loss-gate-replay.py "$out/prior-loss-replay.py" >> "$out/source-sha256.txt"
          p0=2195b822c89795359cd73052b0c43ff2830a4d56
          git fetch --no-tags --depth=1 origin "$p0"
          mkdir -p "$out/p0-tx"
          for name in UsbSerial.h UsbSerial.cpp; do git show "$p0:Repetier/$name" > "$out/p0-tx/$name"; done
          git show "$p0:tests/usb-serial.cpp" > "$out/p0-tx/usb-serial.cpp"
          python3 tools/task0032/tx-ack-replay.py --p0 "$out/p0-tx" | tee "$out/tx-ack-replay.log"
          sha256sum tools/task0032/tx-ack-replay.py "$out"/p0-tx/* >> "$out/source-sha256.txt"
          sha256sum tools/task0032/parser-wire-replay.py tools/task0032/fixed-uart-init.py tools/task0032/fixed-queue-capacity.py >> "$out/source-sha256.txt"
          for test in link-model demand-model queue-model speed-search queue-estimate governor-preview rx-blackout-model rx-service-window; do
            node "tools/task0032/$test.cjs" --self-test
          done
          for test in link-model demand-model queue-model speed-search; do
            node "tools/task0032/$test.cjs" "$out/$test"
          done
          for test in queue-estimate governor-preview rx-blackout-model rx-service-window; do
            node "tools/task0032/$test.cjs" > "$out/$test.json"
          done
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.2.2
      - name: Measure isolated actual AVR parser and ACK cycles
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/task0032"
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libsimavr-dev libelf-dev
          planner=e1b976318fd34c1e556a2f16491aaec9108d0d71
          git fetch --no-tags --depth=1 origin "$planner"
          git show "$planner:research/task0032-planner-queue/simavr-trace.c" > "$out/simavr-trace.c"
          test "$(git hash-object "$out/simavr-trace.c")" = c0dfeca055159db9b918c6a8420bc2d441bae079
          compiler="$HOME/.arduino15/packages/arduino/tools/avr-gcc/7.3.0-atmel3.6.1-arduino7/bin/avr-g++"
          git show "4cdb22106e66c02f86dffeb3f49a6a15506c2038:tools/task0033/isr-candidates.py" > "$out/prior-isr.py"
          python3 tools/task0032/loss-isr-bench.py --prior-isr "$out/prior-isr.py" --compiler "$compiler" --out "$out/loss-isr"
          sha256sum tools/task0032/loss-isr-bench.py "$out/prior-isr.py" >> "$out/source-sha256.txt"
          python3 tools/task0032/parser-avr-bench.py --compiler "$compiler" --runner-source "$out/simavr-trace.c" --out "$out/parser-avr"
          python3 tools/task0032/parser-avr-bench.py --compiler "$compiler" --runner-source "$out/simavr-trace.c" --out "$out/parser-avr-u16" --decimal u16-tail
          node -e 'const a=require(process.argv[1]),b=require(process.argv[2]); if(JSON.stringify(a.samples)!==JSON.stringify(b.samples)||a.records.length!==b.records.length)throw Error("unmatched fixtures"); const rows=a.records.map((r,i)=>{const s=b.records[i];if(r.format!==s.format||r.id!==s.id||r.stage!==s.stage)throw Error("unmatched record");return {...r,candidateCycles:s.cycles,saved:r.cycles-s.cycles}});console.log(JSON.stringify({schema:1,baselineElf:a.elf_sha256,candidateElf:b.elf_sha256,rows},null,2))' "$out/parser-avr/parser-results.json" "$out/parser-avr-u16/parser-results.json" > "$out/decimal-comparison.json"
          node -e 'const r=require(process.argv[1]); console.log(JSON.stringify([1,2,5].map(stage=>{const a=r.rows.filter(x=>x.stage===stage);const s=a.map(x=>x.saved).sort((a,b)=>a-b);return {stage,n:a.length,minSaved:s[0],medianSaved:s[Math.floor(s.length/2)],maxSaved:s.at(-1)}}),null,2))' "$out/decimal-comparison.json"
          sha256sum tools/task0032/parser-avr-bench.py >> "$out/source-sha256.txt"
          git show "$planner:research/task0032-planner-queue/REPORT.md" > "$out/planner-report.md"
          node tools/task0032/measured-cost-sweep.cjs "$out/transport-contract-input.json" "$out/planner-report.md" "$out/parser-avr/parser-results.json" > "$out/measured-cost-sweep.json"
          node -e 'const r=require(process.argv[1]); console.log(JSON.stringify({plannerCosts:r.plannerCosts,receiverCosts:r.receiverCosts,cases:r.rows.length,summary:Object.keys(r.plannerCosts).map(k=>{const a=r.rows.filter(x=>x.plannerCase===k&&x.frameWindow===32);return {case:k,n:a.length,localCpuFeasible:a.filter(x=>x.localCpuFeasible).length,zeroGaps:a.filter(x=>x.gaps===0).length}})},null,2))' "$out/measured-cost-sweep.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task0032-simulation-${{ github.sha }}
          path: ${{ runner.temp }}/task0032
          retention-days: 7
          if-no-files-found: error
