name: Task0032 simulation checks
on:
  pull_request:
    branches: [ai-firmware-review]
    paths:
      - 'tools/task0032/**'
      - '.github/workflows/task0032-simulation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'task/Task0032-quality-packing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Run task-private self-tests and reproduce evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task0032"
          out="$RUNNER_TEMP/task0032"
          git rev-parse HEAD > "$out/checkout-sha.txt"
          node --version > "$out/node-version.txt"
          sha256sum tools/task0032/*.cjs > "$out/source-sha256.txt"
          # Reuse the immutable Task0033 handoff; do not copy/fork its model.
          transport=4cdb22106e66c02f86dffeb3f49a6a15506c2038
          git fetch --no-tags --depth=1 origin "$transport"
          git show "$transport:tools/task0033/transport-contract-results.json" > "$out/transport-contract-input.json"
          node tools/task0032/transport-handoff.cjs "$out/transport-contract-input.json" > "$out/transport-handoff.json"
          node tools/task0032/baud-validation.cjs > "$out/baud-validation.json"
          python3 tools/task0032/parser-wire-replay.py | tee "$out/parser-wire-replay.log"
          grep '^TASK0032_WIRE ' "$out/parser-wire-replay.log" | sed 's/^TASK0032_WIRE //' > "$out/parser-wire-results.jsonl"
          test "$(wc -l < "$out/parser-wire-results.jsonl")" -eq 4
          python3 tools/task0032/fixed-uart-init.py | tee "$out/fixed-uart-init.log"
          python3 tools/task0032/fixed-queue-capacity.py | tee "$out/fixed-queue-capacity.log"
          sha256sum tools/task0032/parser-wire-replay.py tools/task0032/fixed-uart-init.py tools/task0032/fixed-queue-capacity.py >> "$out/source-sha256.txt"
          for test in link-model demand-model queue-model speed-search queue-estimate governor-preview rx-blackout-model rx-service-window; do
            node "tools/task0032/$test.cjs" --self-test
          done
          for test in link-model demand-model queue-model speed-search; do
            node "tools/task0032/$test.cjs" "$out/$test"
          done
          for test in queue-estimate governor-preview rx-blackout-model rx-service-window; do
            node "tools/task0032/$test.cjs" > "$out/$test.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: task0032-simulation-${{ github.sha }}
          path: ${{ runner.temp }}/task0032
          retention-days: 7
          if-no-files-found: error
