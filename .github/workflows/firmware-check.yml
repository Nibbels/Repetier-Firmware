name: RFx000 firmware
on:
  pull_request:
    branches: [ai-firmware-review]
    paths-ignore:
      - 'coordination/**'
      - 'docs/**'
      - '**/*.md'
permissions:
  contents: read
concurrency:
  group: rfx000-firmware-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    name: Host replays and four AVR builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: arduino/setup-arduino-cli@v2.1.0
        with:
          version: 1.2.2
      - name: Install Arduino AVR Boards
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
      - name: Verify merge candidate
        run: python3 tools/task0003-baseline.py "$RUNNER_TEMP/firmware-evidence"
      - name: Install linked-audit dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/a73-venv"
          "$RUNNER_TEMP/a73-venv/bin/python" -m pip install networkx==3.4.2
      - name: A73 linked diagnostic (not release proof)
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          "$RUNNER_TEMP/a73-venv/bin/python" tools/task0034/test-timer1-exclusion.py
          python3 -c 'import shutil, os; shutil.make_archive(os.environ["RUNNER_TEMP"] + "/a73-input", "zip", os.environ["RUNNER_TEMP"] + "/firmware-evidence")'
          digest=$(sha256sum "$RUNNER_TEMP/a73-input.zip" | cut -d' ' -f1)
          "$RUNNER_TEMP/a73-venv/bin/python" tools/task0034/global-a73-evidence.py "$RUNNER_TEMP/a73-input.zip" "$digest" "${{ github.sha }}" --linked > "$RUNNER_TEMP/firmware-evidence/a73-linked.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: firmware-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/firmware-evidence
          retention-days: 7
